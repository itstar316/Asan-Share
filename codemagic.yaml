workflows:
  android-apk:
    name: Asan Share APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          set -e
          findproj() {
            find "$1" -maxdepth 4 -name settings.gradle.kts -not -path '*/build/*' -not -path '*/__MACOSX/*' | head -n 1
          }
          SETTINGS=$(findproj "$CM_BUILD_DIR")
          if [ -z "$SETTINGS" ]; then
            # Use AsanShare.zip. If there are several zips, refuse to guess (an old zip would build an old app).
            ZIPS=$(find "$CM_BUILD_DIR" -maxdepth 3 -name '*.zip')
            COUNT=$(echo "$ZIPS" | grep -c . || true)
            if [ -f "$CM_BUILD_DIR/AsanShare.zip" ]; then ZIP="$CM_BUILD_DIR/AsanShare.zip"
            elif [ "$COUNT" = "1" ]; then ZIP="$ZIPS"
            else
              echo "ERROR: found $COUNT zip files. Keep only ONE (named AsanShare.zip) in the repo:"
              echo "$ZIPS"
              exit 1
            fi
            echo "Unzipping $ZIP"
            rm -rf "$CM_BUILD_DIR/unzipped"; mkdir -p "$CM_BUILD_DIR/unzipped"
            unzip -q -o "$ZIP" -d "$CM_BUILD_DIR/unzipped"
            SETTINGS=$(findproj "$CM_BUILD_DIR/unzipped")
          fi
          if [ -z "$SETTINGS" ]; then echo "ERROR: settings.gradle.kts not found."; exit 1; fi
          PROJ=$(dirname "$SETTINGS")
          echo "Project folder: $PROJ"
          cd "$PROJ"
          if [ ! -f gradlew ]; then
            mkdir -p /tmp/wrap && cd /tmp/wrap && touch settings.gradle
            gradle wrapper --gradle-version 8.9 --distribution-type bin
            cd "$PROJ"
            cp -r /tmp/wrap/gradle /tmp/wrap/gradlew .
          fi
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - "**/outputs/apk/**/*.apk"
